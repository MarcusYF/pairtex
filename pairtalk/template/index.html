<link rel="stylesheet" href="css/deck.css">
<script>
  window.MathJax = {
    loader: { load: ['ui/safe'], paths: { mathjax: 'vendor/mathjax' } },
    options: { safeOptions: {
      safeProtocols: { http: true, https: true, file: false, javascript: false, data: false },
      classPattern: /^(?:mjx-[-a-zA-Z0-9_.]+|c-(?:blue|gold|teal|orange|green|red|purple|ink|ink2))$/
    } },
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']], packages: {'[+]': ['color', 'boldsymbol', 'cancel', 'bbox', 'html']} },
    chtml: { fontURL: 'vendor/mathjax/output/chtml/fonts/woff-v2', mtextInheritFont: false, scale: 1 },
    startup: { typeset: false }
  };
</script>
<script src="vendor/mathjax/tex-chtml-full.js"></script>
<link rel="stylesheet" href="css/comments.css">
<link rel="stylesheet" href="css/presenter.css">
<link rel="stylesheet" href="css/speaker.css">
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="overview"></div>
<div id="blank"></div>
<div id="jump"></div>
<script src="js/engine.js"></script>
<script src="js/lib.js"></script>
<script src="slides/order.js"></script>
<script>
  // ?only=02,05  loads just the slide files whose names start with these prefixes, e.g. to review a few slides
  const only = window.ONLY || new URLSearchParams(location.search).get('only');
  const files = only ? window.ORDER.filter(f => only.split(',').some(o => o && f.startsWith(o.trim()))) : window.ORDER;
  Deck.boot(files.map(f => 'slides/' + f));
</script>
<script>
  window.DECK_COMMENTS = 'talk';   // the talk's name on the review server and the shared site (letters, digits, - and _)
  window.DECK_MINUTES = 15;        // the slot, in minutes: the speaker view's timer turns gold two minutes before, red after
</script>
<script src="js/comments.js"></script>
<script src="js/presenter.js"></script>
<script src="js/speaker.js"></script>
</body>
