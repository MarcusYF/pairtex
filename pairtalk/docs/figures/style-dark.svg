<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" width="960" height="368" role="img" aria-label="How the talk-style guide learns: your rewrites of the agent's script, your undos, what you say always about, your own notes and your past talks become evidence, distilled into STYLE.md with a Pacing and script table; coauthors' comments are fixed but never learned">
<style>text{font-family:'CMU Serif','Latin Modern Roman',Georgia,'Times New Roman',serif;fill:#E6EDF3} .m{font-family:Menlo,'SF Mono',Consolas,'DejaVu Sans Mono',monospace} .b{font-weight:700} .i{font-style:italic}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#9198A1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#D4A33A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#B39DDB"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5AA8DA"/></marker><marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5DBB63"/></marker></defs>
<text x="10" y="18" font-size="15.5" style="fill:#9198A1">Where the evidence comes from</text>
<rect x="10" y="30" width="340" height="42" rx="6" fill="#0F2536" stroke="#5AA8DA" stroke-width="1.6"/>
<text x="24" y="57" font-size="16"><tspan class="b">You rewrite</tspan> the agent’s script</text>
<text x="338" y="57" font-size="14.5" class="i" text-anchor="end" style="fill:#5AA8DA">strongest</text>
<path d="M352,51 C380,51 380,151 404,151" stroke="#7D8590" stroke-width="1.6" fill="none"/>
<rect x="10" y="80" width="340" height="42" rx="6" fill="#0F2536" stroke="#5AA8DA" stroke-width="1.6"/>
<text x="24" y="107" font-size="16"><tspan class="b">You undo</tspan> a change</text>
<text x="338" y="107" font-size="14.5" class="i" text-anchor="end" style="fill:#5AA8DA">never again</text>
<path d="M352,101 C380,101 380,151 404,151" stroke="#7D8590" stroke-width="1.6" fill="none"/>
<rect x="10" y="130" width="340" height="42" rx="6" fill="#0F2536" stroke="#5AA8DA" stroke-width="1.6"/>
<text x="24" y="157" font-size="16"><tspan class="b">You say</tspan> “always …”</text>
<text x="338" y="157" font-size="14.5" class="i" text-anchor="end" style="fill:#5AA8DA">a rule at once</text>
<path d="M352,151 C380,151 380,151 404,151" stroke="#7D8590" stroke-width="1.6" fill="none"/>
<rect x="10" y="180" width="340" height="42" rx="6" fill="#0F2536" stroke="#5AA8DA" stroke-width="1.6"/>
<text x="24" y="207" font-size="16"><tspan class="b">You edit</tspan> your own notes</text>
<text x="338" y="207" font-size="14.5" class="i" text-anchor="end" style="fill:#5AA8DA">your habits</text>
<path d="M352,201 C380,201 380,151 404,151" stroke="#7D8590" stroke-width="1.6" fill="none"/>
<rect x="10" y="230" width="340" height="42" rx="6" fill="#261E0F" stroke="#D4A33A" stroke-width="1.6"/>
<text x="24" y="257" font-size="16"><tspan class="b">Your past talks</tspan> </text>
<text x="338" y="257" font-size="14.5" class="i" text-anchor="end" style="fill:#E3B95A">seed</text>
<path d="M352,251 C380,251 380,151 404,151" stroke="#7D8590" stroke-width="1.6" fill="none"/>
<rect x="10" y="286" width="340" height="42" rx="6" fill="#161B22" stroke="#7D8590" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="24" y="313" font-size="16" style="fill:#9198A1"><tspan class="b">A coauthor</tspan> comments</text>
<text x="338" y="313" font-size="14.5" class="i" text-anchor="end" style="fill:#9198A1">fixed, not learned</text>
<path d="M404,151 L414,151" stroke="#7D8590" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="418" y="108" width="160" height="86" rx="6" fill="#161B22" stroke="#7D8590" stroke-width="1.6"/>
<text x="498" y="138" font-size="16" class="b" text-anchor="middle">Evidence log</text>
<text x="498" y="160" font-size="14.5" text-anchor="middle" style="fill:#9198A1">each event with</text>
<text x="498" y="179" font-size="14.5" text-anchor="middle" style="fill:#9198A1">its before and after</text>
<path d="M580,151 L606,151" stroke="#7D8590" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="612" y="12" width="346" height="316" rx="8" fill="#261E0F" stroke="#D4A33A" stroke-width="1.8"/>
<text x="630" y="40" font-size="17" class="b" style="fill:#E3B95A">STYLE.md</text>
<text x="940" y="40" font-size="14.5" text-anchor="end" style="fill:#E3B95A">yours to edit</text>
<line x1="630" y1="50" x2="940" y2="50" stroke="#5A4520" stroke-width="1.2"/>
<text x="630" y="76" font-size="15.5" class="b">Base rules</text>
<text x="940" y="76" font-size="14.5" text-anchor="end" style="fill:#9198A1">only you add these</text>
<text x="630" y="102" font-size="15.5" class="b">Confirmed rules</text>
<text x="940" y="102" font-size="14.5" text-anchor="end" style="fill:#9198A1">3 pieces of evidence</text>
<text x="630" y="128" font-size="15.5" class="b">Tentative patterns</text>
<text x="940" y="128" font-size="14.5" text-anchor="end" style="fill:#9198A1">seen once or twice</text>
<text x="630" y="154" font-size="15.5" class="b">Pacing and script</text>
<rect x="630" y="164" width="310" height="76" rx="4" fill="#161B22" stroke="#5A4520" stroke-width="1.2"/>
<text x="642" y="186" font-size="15" style="fill:#9198A1">pace</text><text x="738" y="186" font-size="15" class="i">135 words a minute (seed)</text>
<text x="642" y="208" font-size="15" style="fill:#9198A1">opening</text><text x="738" y="208" font-size="15" class="i">a question, then the claim</text>
<text x="642" y="230" font-size="15" style="fill:#9198A1">hand-over</text><text x="738" y="230" font-size="15" class="i">one bridge line per slide</text>
<text x="630" y="264" font-size="15.5" class="b">What you undid</text>
<text x="940" y="264" font-size="14.5" text-anchor="end" style="fill:#9198A1">never repeated</text>
<text x="630" y="296" font-size="14.5" style="fill:#9198A1">Every change is a git commit you can undo.</text>
<path d="M784,332 C784,350 704,354 622,354" stroke="#B39DDB" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<text x="614" y="359" font-size="15" text-anchor="end" style="fill:#B39DDB">the agent reads it before every slide</text>
</svg>
