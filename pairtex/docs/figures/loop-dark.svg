<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 414" width="960" height="414" role="img" aria-label="The PairTeX loop: you comment in your editor, the agent edits and replies, both land in the paper, and every round teaches your style guide">
<style>text{font-family:'CMU Serif','Latin Modern Roman',Georgia,'Times New Roman',serif;fill:#E6EDF3} .m{font-family:Menlo,'SF Mono',Consolas,'DejaVu Sans Mono',monospace} .b{font-weight:700} .i{font-style:italic}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#9198A1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#D4A33A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#B39DDB"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5AA8DA"/></marker><marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5DBB63"/></marker></defs>
<circle cx="22" cy="14" r="11" fill="#D4A33A"/><text x="22" y="19.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">1</text>
<text x="40" y="20" font-size="17" class="b" style="fill:#5AA8DA">You comment in your editor</text>
<circle cx="352" cy="14" r="11" fill="#D4A33A"/><text x="352" y="19.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">2</text>
<text x="370" y="20" font-size="17" class="b" style="fill:#B39DDB">The agent answers</text>
<circle cx="662" cy="14" r="11" fill="#D4A33A"/><text x="662" y="19.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">3</text>
<text x="680" y="20" font-size="17" class="b">Both land in the paper</text>
<rect x="10" y="34" width="292" height="250" rx="8" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/><path d="M10,42 a8,8 0 0 1 8,-8 h276 a8,8 0 0 1 8,8 v22 h-292 Z" fill="#21262D"/><circle cx="27" cy="49" r="4.5" fill="#484F58"/><circle cx="42" cy="49" r="4.5" fill="#484F58"/><circle cx="57" cy="49" r="4.5" fill="#484F58"/><text x="76" y="54" font-size="14" class="m" style="fill:#9198A1">main.tex</text>
<rect x="20" y="140" width="196" height="22" rx="3" fill="#0F2536"/>
<text x="24" y="90" font-size="14.5" class="m">Iterative preference</text>
<text x="24" y="112" font-size="14.5" class="m">optimization trains a</text>
<text x="24" y="134" font-size="14.5" class="m">policy on its samples,</text>
<text x="24" y="156" font-size="14.5" class="m"><tspan class="b" style="fill:#5AA8DA">[[</tspan>reference refresh<tspan class="b" style="fill:#5AA8DA">]]</tspan> at</text>
<text x="24" y="178" font-size="14.5" class="m">every round.</text>
<text x="24" y="210" font-size="14.5" class="m" style="fill:#5AA8DA"><tspan class="b">%!</tspan> too much jargon;</text>
<text x="24" y="232" font-size="14.5" class="m" style="fill:#5AA8DA">%  define it before</text>
<text x="24" y="254" font-size="14.5" class="m" style="fill:#5AA8DA">%  using it, max 5 lines<tspan class="b">..</tspan></text>
<path d="M306,159 L334,159" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="340" y="70" width="282" height="178" rx="8" fill="#231C33" stroke="#B39DDB" stroke-width="1.8"/>
<text x="481" y="99" font-size="17.5" class="b" text-anchor="middle" style="fill:#B39DDB">Your agent + pairtex</text>
<text x="481" y="119" font-size="14.5" text-anchor="middle" style="fill:#9198A1">(Claude Code, Codex, …)</text>
<circle cx="358" cy="146" r="3.5" fill="#B39DDB"/><text x="370" y="151" font-size="15">picks up the comment</text>
<circle cx="358" cy="171" r="3.5" fill="#B39DDB"/><text x="370" y="176" font-size="15">reads the text and your style</text>
<circle cx="358" cy="196" r="3.5" fill="#B39DDB"/><text x="370" y="201" font-size="15">edits the .tex, writes a reply</text>
<circle cx="358" cy="221" r="3.5" fill="#B39DDB"/><text x="370" y="226" font-size="15">compile-checks, publishes</text>
<path d="M626,159 L652,159" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M658,34 H928 L950,56 V284 H658 Z" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/><path d="M928,34 V56 H950" fill="#21262D" stroke="#3D444D" stroke-width="1.6"/><rect x="674" y="50" width="190" height="7" rx="3" fill="#30363D"/><rect x="674" y="64" width="240" height="7" rx="3" fill="#30363D"/>
<text x="674" y="96" font-size="15">Iterative preference optimization</text>
<text x="674" y="116" font-size="15">trains a policy on its own samples.</text>
<text x="674" y="136" font-size="15">Each round it resets the reference</text>
<text x="674" y="156" font-size="15">to the newest policy (<tspan class="i">reference</tspan></text>
<text x="674" y="176" font-size="15"><tspan class="i">refresh</tspan>), so the target moves.</text>
<rect x="668" y="188" width="274" height="66" rx="4" fill="#12261A"/>
<text x="676" y="207" font-size="14.3" style="fill:#5DBB63">[c7] <tspan class="b">Ada:</tspan> too much jargon;</text>
<text x="676" y="226" font-size="14.3" style="fill:#5DBB63">define it before using it, max 5</text>
<text x="676" y="245" font-size="14.3" style="fill:#5DBB63">lines <tspan class="b">Claude:</tspan> Defined it. 5 lines.</text>
<rect x="674" y="264" width="220" height="7" rx="3" fill="#30363D"/>
<rect x="340" y="318" width="282" height="64" rx="8" fill="#261E0F" stroke="#D4A33A" stroke-width="1.8"/>
<circle cx="360" cy="337" r="11" fill="#D4A33A"/><text x="360" y="342.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">4</text>
<text x="378" y="343" font-size="17.5" class="b" style="fill:#E3B95A">Your style guide</text>
<text x="360" y="368" font-size="14.5">STYLE.md: plain text, in git</text>
<path d="M804,288 C804,340 720,350 626,350" stroke="#D4A33A" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
<path d="M156,288 C156,340 240,350 336,350" stroke="#D4A33A" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
<path d="M481,316 L481,252" stroke="#B39DDB" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<text x="472" y="290" font-size="14.5" text-anchor="end" style="fill:#B39DDB">read before every edit</text>
<text x="950" y="381" font-size="14.5" text-anchor="end" style="fill:#E3B95A">what you keep, rewrite or undo</text>
<text x="12" y="381" font-size="14.5" style="fill:#E3B95A">and what you write yourself</text>
<text x="950" y="406" font-size="14.5" text-anchor="end" style="fill:#9198A1">Accept: delete the note. Follow up: comment under it.</text>
</svg>
