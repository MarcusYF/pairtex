<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="Seeding: pairdeck seed reads your past .pptx, .pdf and .html decks on your computer (palette, fonts, words per slide, titles, page images); the agent drafts STYLE.md entries with how many decks support each; you keep, edit or delete them">
<style>text{font-family:'CMU Serif','Latin Modern Roman',Georgia,'Times New Roman',serif;fill:#E6EDF3} .m{font-family:Menlo,'SF Mono',Consolas,'DejaVu Sans Mono',monospace} .b{font-weight:700} .i{font-style:italic}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#9198A1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#D4A33A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#B39DDB"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5AA8DA"/></marker><marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5DBB63"/></marker></defs>
<text x="10" y="18" font-size="15.5" style="fill:#9198A1">Decks you already made</text>
<rect x="10" y="32" width="250" height="40" rx="6" fill="#161B22" stroke="#3D444D" stroke-width="1.4"/>
<text x="24" y="58" font-size="15" class="m b" style="fill:#5AA8DA">.pptx</text>
<text x="92" y="58" font-size="15">a course lecture</text>
<rect x="10" y="82" width="250" height="40" rx="6" fill="#161B22" stroke="#3D444D" stroke-width="1.4"/>
<text x="24" y="108" font-size="15" class="m b" style="fill:#5AA8DA">.pdf</text>
<text x="92" y="108" font-size="15">a conference talk</text>
<rect x="10" y="132" width="250" height="40" rx="6" fill="#161B22" stroke="#3D444D" stroke-width="1.4"/>
<text x="24" y="158" font-size="15" class="m b" style="fill:#5AA8DA">.html</text>
<text x="92" y="158" font-size="15">an old explainer</text>
<rect x="10" y="182" width="250" height="40" rx="6" fill="#161B22" stroke="#3D444D" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="24" y="208" font-size="15" class="m b" style="fill:#9198A1">.key</text>
<text x="92" y="208" font-size="15" class="i" style="fill:#9198A1">export to PDF first</text>
<path d="M266,120 L296,120" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="302" y="22" width="300" height="206" rx="8" fill="#231C33" stroke="#B39DDB" stroke-width="1.8"/>
<text x="452" y="50" font-size="17" class="m b" text-anchor="middle" style="fill:#B39DDB">pairdeck seed</text>
<circle cx="322" cy="80" r="3.5" fill="#B39DDB"/><text x="334" y="85" font-size="15">palette, with how much each is used</text>
<circle cx="322" cy="106" r="3.5" fill="#B39DDB"/><text x="334" y="111" font-size="15">fonts and sizes</text>
<circle cx="322" cy="132" r="3.5" fill="#B39DDB"/><text x="334" y="137" font-size="15">words per slide, titles, notes</text>
<circle cx="322" cy="158" r="3.5" fill="#B39DDB"/><text x="334" y="163" font-size="15">page images to look at</text>
<text x="452" y="208" font-size="14" class="i" text-anchor="middle" style="fill:#9198A1">on your computer; files untouched</text>
<path d="M608,120 L638,120" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="644" y="22" width="314" height="206" rx="8" fill="#261E0F" stroke="#D4A33A" stroke-width="1.8"/>
<text x="660" y="50" font-size="17" class="b" style="fill:#E3B95A">STYLE.md, drafted</text>
<text x="660" y="84" font-size="14" class="m b" style="fill:#E3B95A">S01</text><text x="700" y="84" font-size="15">Titles state a claim</text><text x="944" y="84" font-size="14" text-anchor="end" style="fill:#9198A1">5 of 5</text>
<text x="660" y="114" font-size="14" class="m b" style="fill:#E3B95A">S02</text><text x="700" y="114" font-size="15">Navy for the method</text><text x="944" y="114" font-size="14" text-anchor="end" style="fill:#9198A1">4 of 5</text>
<text x="660" y="144" font-size="14" class="m b" style="fill:#E3B95A">T01</text><text x="700" y="144" font-size="15">One chart a slide</text><text x="944" y="144" font-size="14" text-anchor="end" style="fill:#9198A1">2 of 5</text>
<text x="660" y="174" font-size="14" class="m b" style="fill:#E3B95A">T02</text><text x="700" y="174" font-size="15">Under 30 words a slide</text><text x="944" y="174" font-size="14" text-anchor="end" style="fill:#9198A1">2 of 5</text>
<text x="660" y="208" font-size="14" class="i" style="fill:#9198A1">content never becomes a rule</text>
<path d="M800,232 C800,256 700,262 612,262" stroke="#5AA8DA" stroke-width="2" fill="none" marker-end="url(#ay)"/>
<text x="604" y="267" font-size="15" text-anchor="end" style="fill:#5AA8DA">you keep, edit or delete each one</text>
</svg>
