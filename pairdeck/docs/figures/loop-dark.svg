<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 414" width="960" height="414" role="img" aria-label="The PairDeck loop: you drag a box on a slide and comment, the agent edits the deck and replies under your comment, and what you keep, rewrite or undo teaches your style guide">
<style>text{font-family:'CMU Serif','Latin Modern Roman',Georgia,'Times New Roman',serif;fill:#E6EDF3} .m{font-family:Menlo,'SF Mono',Consolas,'DejaVu Sans Mono',monospace} .b{font-weight:700} .i{font-style:italic}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#9198A1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#D4A33A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#B39DDB"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5AA8DA"/></marker><marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5DBB63"/></marker></defs>
<circle cx="22" cy="14" r="11" fill="#D4A33A"/><text x="22" y="19.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">1</text>
<text x="40" y="20" font-size="17" class="b" style="fill:#5AA8DA">You comment on a slide</text>
<circle cx="352" cy="14" r="11" fill="#D4A33A"/><text x="352" y="19.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">2</text>
<text x="370" y="20" font-size="17" class="b" style="fill:#B39DDB">The agent answers</text>
<circle cx="668" cy="14" r="11" fill="#D4A33A"/><text x="668" y="19.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">3</text>
<text x="686" y="20" font-size="17" class="b">The deck updates</text>
<rect x="10" y="34" width="292" height="250" rx="8" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/><path d="M10,42 a8,8 0 0 1 8,-8 h276 a8,8 0 0 1 8,8 v22 h-292 Z" fill="#21262D"/><circle cx="27" cy="49" r="4.5" fill="#484F58"/><circle cx="42" cy="49" r="4.5" fill="#484F58"/><circle cx="57" cy="49" r="4.5" fill="#484F58"/><rect x="72" y="40" width="218" height="18" rx="9" fill="#161B22"/><text x="84" y="54" font-size="13" class="m" style="fill:#9198A1">review page</text>
<rect x="28" y="78" width="150" height="8" rx="4" fill="#30363D"/>
<path d="M50,98 V152" stroke="#3D444D" stroke-width="1.4"/><rect x="50" y="104" width="118" height="16" rx="2" fill="#5AA8DA" opacity=".85"/><rect x="50" y="130" width="104" height="16" rx="2" fill="#7FC8BA" opacity=".85"/>
<rect x="40" y="94" width="186" height="64" rx="5" fill="#0F2536" fill-opacity=".55" stroke="#5AA8DA" stroke-width="1.8" stroke-dasharray="6 4"/>
<rect x="28" y="178" width="256" height="92" rx="7" fill="#161B22" stroke="#5AA8DA" stroke-width="1.6"/>
<text x="40" y="200" font-size="15" style="fill:#5AA8DA"><tspan class="b">Ada:</tspan> label each bar;</text>
<text x="40" y="220" font-size="15" style="fill:#5AA8DA">drop the legend, it makes</text>
<text x="40" y="240" font-size="15" style="fill:#5AA8DA">me look back and forth</text>
<rect x="222" y="244" width="50" height="20" rx="10" fill="#5AA8DA"/><text x="247" y="258" font-size="13" class="b" text-anchor="middle" style="fill:#161B22">Send</text>
<path d="M306,159 L334,159" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="340" y="70" width="290" height="178" rx="8" fill="#231C33" stroke="#B39DDB" stroke-width="1.8"/>
<text x="485" y="99" font-size="17.5" class="b" text-anchor="middle" style="fill:#B39DDB">Your agent + pairdeck</text>
<text x="485" y="119" font-size="14.5" text-anchor="middle" style="fill:#9198A1">(Claude Code, Codex, …)</text>
<circle cx="358" cy="146" r="3.5" fill="#B39DDB"/><text x="370" y="151" font-size="15">picks up the comment and box</text>
<circle cx="358" cy="171" r="3.5" fill="#B39DDB"/><text x="370" y="176" font-size="15">reads the slide and your style</text>
<circle cx="358" cy="196" r="3.5" fill="#B39DDB"/><text x="370" y="201" font-size="15">edits the deck, screenshots it</text>
<circle cx="358" cy="221" r="3.5" fill="#B39DDB"/><text x="370" y="226" font-size="15">replies under your comment</text>
<path d="M634,159 L660,159" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="664" y="34" width="288" height="250" rx="8" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/><path d="M664,42 a8,8 0 0 1 8,-8 h272 a8,8 0 0 1 8,8 v22 h-288 Z" fill="#21262D"/><circle cx="681" cy="49" r="4.5" fill="#484F58"/><circle cx="696" cy="49" r="4.5" fill="#484F58"/><circle cx="711" cy="49" r="4.5" fill="#484F58"/><rect x="726" y="40" width="214" height="18" rx="9" fill="#161B22"/><text x="738" y="54" font-size="13" class="m" style="fill:#9198A1">review page</text>
<rect x="682" y="78" width="150" height="8" rx="4" fill="#30363D"/>
<text x="696" y="117" font-size="15" text-anchor="end" style="fill:#5AA8DA">A</text><text x="696" y="143" font-size="15" text-anchor="end" style="fill:#7FC8BA">B</text>
<path d="M704,98 V152" stroke="#3D444D" stroke-width="1.4"/><rect x="704" y="104" width="118" height="16" rx="2" fill="#5AA8DA" opacity=".85"/><rect x="704" y="130" width="104" height="16" rx="2" fill="#7FC8BA" opacity=".85"/><text x="828" y="117" font-size="14" style="fill:#5AA8DA">93%</text><text x="814" y="143" font-size="14" style="fill:#7FC8BA">87%</text>
<rect x="680" y="178" width="256" height="92" rx="7" fill="#12261A"/><rect x="680" y="178" width="3" height="92" fill="#5DBB63"/>
<text x="692" y="200" font-size="15" style="fill:#5DBB63"><tspan class="b">Claude:</tspan> labelled each</text>
<text x="692" y="220" font-size="15" style="fill:#5DBB63">bar at its end; legend gone,</text>
<text x="692" y="240" font-size="15" style="fill:#5DBB63">on slides 3, 4 and 7.</text>
<rect x="868" y="244" width="56" height="20" rx="10" fill="none" stroke="#5DBB63" stroke-width="1.4"/><text x="896" y="258" font-size="13" class="b" text-anchor="middle" style="fill:#5DBB63">Keep</text>
<rect x="340" y="318" width="290" height="64" rx="8" fill="#261E0F" stroke="#D4A33A" stroke-width="1.8"/>
<circle cx="360" cy="337" r="11" fill="#D4A33A"/><text x="360" y="342.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">4</text>
<text x="378" y="343" font-size="17.5" class="b" style="fill:#E3B95A">Your style guide</text>
<text x="360" y="368" font-size="14.5">STYLE.md: plain text, in git</text>
<path d="M808,288 C808,340 724,350 634,350" stroke="#D4A33A" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
<path d="M156,288 C156,340 240,350 336,350" stroke="#D4A33A" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
<path d="M485,316 L485,252" stroke="#B39DDB" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<text x="476" y="290" font-size="14.5" text-anchor="end" style="fill:#B39DDB">read before every deck</text>
<text x="950" y="381" font-size="14.5" text-anchor="end" style="fill:#E3B95A">what you keep, rewrite or undo</text>
<text x="12" y="381" font-size="14.5" style="fill:#E3B95A">and the decks you made before</text>
<text x="950" y="406" font-size="14.5" text-anchor="end" style="fill:#9198A1">Accept: Keep. Not quite: Follow up, or edit the slide yourself.</text>
</svg>
