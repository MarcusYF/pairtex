<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="With a chatbot you describe the spot on the slide in words every round and it forgets your corrections; with PairDeck you drag a box on the slide, the agent edits in the background, and it learns your style">
<style>text{font-family:'CMU Serif','Latin Modern Roman',Georgia,'Times New Roman',serif;fill:#232323} .m{font-family:Menlo,'SF Mono',Consolas,'DejaVu Sans Mono',monospace} .b{font-weight:700} .i{font-style:italic}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6B6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#C6952C"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6D5398"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#27709C"/></marker><marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#227828"/></marker></defs>
<rect x="0" y="0" width="470" height="300" rx="8" fill="#F6F6F4"/><rect x="0" y="0" width="470" height="4" fill="#9A9A9A"/>
<text x="20" y="36" font-size="18" class="b" style="fill:#6B6B6B">Slides with a chatbot</text>
<rect x="20" y="62" width="160" height="108" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.6"/>
<rect x="34" y="78" width="96" height="7" rx="3" fill="#E4E4E1"/>
<path d="M44,94 V143" stroke="#BDBDBD" stroke-width="1.4"/><rect x="44" y="100" width="92" height="14" rx="2" fill="#27709C" opacity=".85"/><rect x="44" y="123" width="70" height="14" rx="2" fill="#3F8A7E" opacity=".85"/>
<rect x="306" y="62" width="140" height="108" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.6"/><rect x="318" y="78" width="90" height="20" rx="10" fill="#E4E4E1"/><rect x="344" y="106" width="90" height="20" rx="10" fill="#E4E4E1"/><rect x="318" y="134" width="74" height="20" rx="10" fill="#E4E4E1"/>
<path d="M186,94 C222,70 266,70 300,94" stroke="#9A9A9A" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M300,138 C266,162 222,162 186,138" stroke="#9A9A9A" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="243" y="62" font-size="13.5" text-anchor="middle" style="fill:#6B6B6B">“the second bar, top right…”</text>
<text x="243" y="186" font-size="13.5" text-anchor="middle" style="fill:#6B6B6B">re-export, fix the layout</text>
<text x="243" y="121" font-size="14" class="b" text-anchor="middle" style="fill:#B4463C">× every round</text>
<circle cx="31" cy="221" r="9" fill="#FBEDEB"/><path d="M27,217 l8,8 M35,217 l-8,8" stroke="#B4463C" stroke-width="2" stroke-linecap="round"/>
<text x="48" y="226" font-size="15.5">You say where on the slide, in words.</text>
<circle cx="31" cy="247" r="9" fill="#FBEDEB"/><path d="M27,243 l8,8 M35,243 l-8,8" stroke="#B4463C" stroke-width="2" stroke-linecap="round"/>
<text x="48" y="252" font-size="15.5">Every deck starts from a stock template.</text>
<circle cx="31" cy="273" r="9" fill="#FBEDEB"/><path d="M27,269 l8,8 M35,269 l-8,8" stroke="#B4463C" stroke-width="2" stroke-linecap="round"/>
<text x="48" y="278" font-size="15.5">It forgets the corrections you made.</text>
<rect x="490" y="0" width="470" height="300" rx="8" fill="#F3EEF8"/><rect x="490" y="0" width="470" height="4" fill="#6D5398"/>
<text x="510" y="36" font-size="18" class="b" style="fill:#6D5398">With PairDeck</text>
<rect x="514" y="56" width="250" height="124" rx="8" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.6"/><path d="M514,64 a8,8 0 0 1 8,-8 h234 a8,8 0 0 1 8,8 v22 h-250 Z" fill="#F1F1EE"/><circle cx="531" cy="71" r="4.5" fill="#D9D9D9"/><circle cx="546" cy="71" r="4.5" fill="#D9D9D9"/><circle cx="561" cy="71" r="4.5" fill="#D9D9D9"/><rect x="576" y="62" width="176" height="18" rx="9" fill="#FFFFFF"/><text x="588" y="76" font-size="13" class="m" style="fill:#6B6B6B">review page</text>
<rect x="530" y="98" width="110" height="7" rx="3" fill="#E4E4E1"/>
<path d="M546,112 V158" stroke="#BDBDBD" stroke-width="1.4"/><rect x="546" y="118" width="100" height="13" rx="2" fill="#27709C" opacity=".85"/><rect x="546" y="139" width="84" height="13" rx="2" fill="#3F8A7E" opacity=".85"/>
<rect x="538" y="110" width="128" height="50" rx="4" fill="none" stroke="#27709C" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="676" y="104" width="78" height="34" rx="6" fill="#FFFFFF" stroke="#27709C" stroke-width="1.4"/><text x="684" y="125" font-size="13" style="fill:#27709C">label these</text>
<rect x="676" y="142" width="78" height="26" rx="6" fill="#EDF5EC"/><text x="684" y="159" font-size="13" style="fill:#227828">done ✓</text>
<circle cx="884" cy="116" r="34" fill="#FFFFFF" stroke="#6D5398" stroke-width="1.8"/>
<path d="M870,106 h28 v20 h-28 z M876,100 v6 M892,100 v6 M877,115 h3 M888,115 h3 M878,121 h12" stroke="#6D5398" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="884" y="168" font-size="13.5" text-anchor="middle" style="fill:#6D5398">the agent, in</text>
<text x="884" y="184" font-size="13.5" text-anchor="middle" style="fill:#6D5398">the background</text>
<path d="M770,100 C800,90 822,94 846,104" stroke="#6D5398" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
<path d="M846,130 C822,142 800,146 770,138" stroke="#227828" stroke-width="2" fill="none" marker-end="url(#an)"/>
<circle cx="521" cy="221" r="9" fill="#EDF5EC"/><path d="M516,221 l4,4 l7,-8" stroke="#227828" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="538" y="226" font-size="15.5">Point at the slide: drag a box, type, send.</text>
<circle cx="521" cy="247" r="9" fill="#EDF5EC"/><path d="M516,247 l4,4 l7,-8" stroke="#227828" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="538" y="252" font-size="15.5">The agent edits and checks every slide.</text>
<circle cx="521" cy="273" r="9" fill="#EDF5EC"/><path d="M516,273 l4,4 l7,-8" stroke="#227828" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="538" y="278" font-size="15.5">It learns your palette, type and density.</text>
</svg>
