<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Writing with a chatbot means copying text out and pasting it back every round; with PairTeX the comment stays in the .tex file and the agent answers in the background">
<style>text{font-family:'CMU Serif','Latin Modern Roman',Georgia,'Times New Roman',serif;fill:#E6EDF3} .m{font-family:Menlo,'SF Mono',Consolas,'DejaVu Sans Mono',monospace} .b{font-weight:700} .i{font-style:italic}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#9198A1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#D4A33A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#B39DDB"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5AA8DA"/></marker><marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5DBB63"/></marker></defs>
<rect x="0" y="0" width="470" height="300" rx="8" fill="#161B22"/><rect x="0" y="0" width="470" height="4" fill="#7D8590"/>
<text x="20" y="36" font-size="18" class="b" style="fill:#9198A1">Writing with a chatbot</text>
<rect x="20" y="66" width="154" height="104" rx="8" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/><path d="M20,74 a8,8 0 0 1 8,-8 h138 a8,8 0 0 1 8,8 v22 h-154 Z" fill="#21262D"/><circle cx="37" cy="81" r="4.5" fill="#484F58"/><circle cx="52" cy="81" r="4.5" fill="#484F58"/><circle cx="67" cy="81" r="4.5" fill="#484F58"/><text x="86" y="86" font-size="14" class="m" style="fill:#9198A1">paper.tex</text>
<rect x="36" y="108" width="112" height="6" rx="3" fill="#30363D"/>
<rect x="36" y="122" width="90" height="6" rx="3" fill="#30363D"/>
<rect x="36" y="136" width="104" height="6" rx="3" fill="#30363D"/>
<rect x="36" y="150" width="66" height="6" rx="3" fill="#30363D"/>
<rect x="306" y="66" width="140" height="104" rx="8" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/><rect x="318" y="82" width="90" height="20" rx="10" fill="#30363D"/><rect x="344" y="110" width="90" height="20" rx="10" fill="#30363D"/><rect x="318" y="138" width="74" height="20" rx="10" fill="#30363D"/>
<path d="M180,98 C218,74 264,74 300,98" stroke="#7D8590" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M300,142 C264,166 218,166 180,142" stroke="#7D8590" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="240" y="66" font-size="13.5" text-anchor="middle" style="fill:#9198A1">copy, explain again</text>
<text x="240" y="190" font-size="13.5" text-anchor="middle" style="fill:#9198A1">paste back, fix LaTeX</text>
<text x="240" y="125" font-size="14" class="b" text-anchor="middle" style="fill:#E5786D">× every round</text>
<circle cx="31" cy="221" r="9" fill="#2D1614"/><path d="M27,217 l8,8 M35,217 l-8,8" stroke="#E5786D" stroke-width="2" stroke-linecap="round"/>
<text x="48" y="226" font-size="15.5">Each round trip breaks your train of thought.</text>
<circle cx="31" cy="247" r="9" fill="#2D1614"/><path d="M27,243 l8,8 M35,243 l-8,8" stroke="#E5786D" stroke-width="2" stroke-linecap="round"/>
<text x="48" y="252" font-size="15.5">The drafts sound like the model.</text>
<circle cx="31" cy="273" r="9" fill="#2D1614"/><path d="M27,269 l8,8 M35,269 l-8,8" stroke="#E5786D" stroke-width="2" stroke-linecap="round"/>
<text x="48" y="278" font-size="15.5">It forgets every correction you made.</text>
<rect x="490" y="0" width="470" height="300" rx="8" fill="#231C33"/><rect x="490" y="0" width="470" height="4" fill="#B39DDB"/>
<text x="510" y="36" font-size="18" class="b" style="fill:#B39DDB">With PairTeX</text>
<rect x="514" y="66" width="250" height="104" rx="8" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/><path d="M514,74 a8,8 0 0 1 8,-8 h234 a8,8 0 0 1 8,8 v22 h-250 Z" fill="#21262D"/><circle cx="531" cy="81" r="4.5" fill="#484F58"/><circle cx="546" cy="81" r="4.5" fill="#484F58"/><circle cx="561" cy="81" r="4.5" fill="#484F58"/><text x="580" y="86" font-size="14" class="m" style="fill:#9198A1">paper.tex</text>
<rect x="526" y="108" width="200" height="6" rx="3" fill="#30363D"/>
<rect x="526" y="122" width="160" height="6" rx="3" fill="#30363D"/>
<text x="526" y="146" font-size="13" class="m" style="fill:#5AA8DA"><tspan class="b">%!</tspan> tighten this<tspan class="b">..</tspan></text>
<rect x="524" y="153" width="230" height="11" rx="3" fill="#12261A"/><rect x="530" y="156.5" width="150" height="4" rx="2" fill="#5DBB63" opacity="0.55"/>
<circle cx="884" cy="116" r="34" fill="#161B22" stroke="#B39DDB" stroke-width="1.8"/>
<path d="M870,106 h28 v20 h-28 z M876,100 v6 M892,100 v6 M877,115 h3 M888,115 h3 M878,121 h12" stroke="#B39DDB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="884" y="168" font-size="13.5" text-anchor="middle" style="fill:#B39DDB">the agent, in</text>
<text x="884" y="184" font-size="13.5" text-anchor="middle" style="fill:#B39DDB">the background</text>
<path d="M770,104 C800,92 822,96 846,106" stroke="#B39DDB" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
<path d="M846,130 C822,142 800,146 770,136" stroke="#5DBB63" stroke-width="2" fill="none" marker-end="url(#an)"/>
<circle cx="521" cy="221" r="9" fill="#12261A"/><path d="M516,221 l4,4 l7,-8" stroke="#5DBB63" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="538" y="226" font-size="15.5">Comments live in the .tex file: no copy, no paste.</text>
<circle cx="521" cy="247" r="9" fill="#12261A"/><path d="M516,247 l4,4 l7,-8" stroke="#5DBB63" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="538" y="252" font-size="15.5">You keep writing while the agent works.</text>
<circle cx="521" cy="273" r="9" fill="#12261A"/><path d="M516,273 l4,4 l7,-8" stroke="#5DBB63" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="538" y="278" font-size="15.5">It learns a style guide from your edits.</text>
</svg>
