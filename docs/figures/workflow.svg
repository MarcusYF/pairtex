<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 488" width="1240" height="488" role="img" aria-label="Four moments of research, four tools: PairDeck reports what you found, PairTeX writes the paper, PairTalk gives the talk, PairPoster pitches it on a poster. Each keeps a style vault, seeded from your own work and grown from your feedback, and runs in the coding agent you already use">
<style>text{font-family:'CMU Serif','Latin Modern Roman',Georgia,'Times New Roman',serif;fill:#232323} .m{font-family:Menlo,'SF Mono',Consolas,'DejaVu Sans Mono',monospace} .b{font-weight:700} .i{font-style:italic}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6B6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#C6952C"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6D5398"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#27709C"/></marker><marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#227828"/></marker></defs>
<circle cx="22" cy="16" r="11" fill="#C6952C"/><text x="22" y="21.2" font-size="15" class="b" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">1</text>
<text x="40" y="22" font-size="17" class="b">Report what you found</text>
<rect x="10" y="38" width="290" height="236" rx="10" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.6"/>
<text x="155.0" y="84" font-size="34" class="b" text-anchor="middle">Pair<tspan style="fill:#6D5398">Deck</tspan></text>
<line x1="34" y1="104" x2="276" y2="104" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="32" y="132" font-size="14.5" style="fill:#6B6B6B">You give feedback</text>
<text x="32" y="155" font-size="16" style="fill:#27709C">comments on a slide,</text>
<text x="32" y="176" font-size="16" style="fill:#27709C">in your browser</text>
<text x="32" y="214" font-size="14.5" style="fill:#6B6B6B">Your agent delivers</text>
<text x="32" y="237" font-size="16" style="fill:#6D5398">an animated HTML deck</text>
<text x="32" y="258" font-size="16" style="fill:#6D5398">that explains one idea</text>
<path d="M304,156 L324,156" stroke="#6B6B6B" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M155.0,344 L155.0,280" stroke="#6D5398" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<circle cx="332" cy="16" r="11" fill="#C6952C"/><text x="332" y="21.2" font-size="15" class="b" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">2</text>
<text x="350" y="22" font-size="17" class="b">Write the paper</text>
<rect x="320" y="38" width="290" height="236" rx="10" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.6"/>
<text x="465.0" y="84" font-size="34" class="b" text-anchor="middle">Pair<tspan style="fill:#6D5398">T</tspan><tspan dx="-3.9" dy="6.8" style="fill:#6D5398">E</tspan><tspan dx="-3.9" dy="-6.8" style="fill:#6D5398">X</tspan></text>
<line x1="344" y1="104" x2="586" y2="104" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="342" y="132" font-size="14.5" style="fill:#6B6B6B">You give feedback</text>
<text x="342" y="155" font-size="16" style="fill:#27709C">%! comments in</text>
<text x="342" y="176" font-size="16" style="fill:#27709C">your LaTeX source</text>
<text x="342" y="214" font-size="14.5" style="fill:#6B6B6B">Your agent delivers</text>
<text x="342" y="237" font-size="16" style="fill:#6D5398">the paper, on Overleaf,</text>
<text x="342" y="258" font-size="16" style="fill:#6D5398">git or a folder</text>
<path d="M614,156 L634,156" stroke="#6B6B6B" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M465.0,344 L465.0,280" stroke="#6D5398" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<circle cx="642" cy="16" r="11" fill="#C6952C"/><text x="642" y="21.2" font-size="15" class="b" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">3</text>
<text x="660" y="22" font-size="17" class="b">Give the talk</text>
<rect x="630" y="38" width="290" height="236" rx="10" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.6"/>
<text x="775.0" y="84" font-size="34" class="b" text-anchor="middle">Pair<tspan style="fill:#6D5398">Talk</tspan></text>
<line x1="654" y1="104" x2="896" y2="104" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="652" y="132" font-size="14.5" style="fill:#6B6B6B">You give feedback</text>
<text x="652" y="155" font-size="16" style="fill:#27709C">comments on the talk site</text>
<text x="652" y="176" font-size="16" style="fill:#27709C">and script edits</text>
<text x="652" y="214" font-size="14.5" style="fill:#6B6B6B">Your agent delivers</text>
<text x="652" y="237" font-size="16" style="fill:#6D5398">a talk with builds and</text>
<text x="652" y="258" font-size="16" style="fill:#6D5398">a speaker script</text>
<path d="M924,156 L944,156" stroke="#6B6B6B" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M775.0,344 L775.0,280" stroke="#6D5398" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<circle cx="952" cy="16" r="11" fill="#C6952C"/><text x="952" y="21.2" font-size="15" class="b" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">4</text>
<text x="970" y="22" font-size="17" class="b">Pitch it on a poster</text>
<rect x="940" y="38" width="290" height="236" rx="10" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.6"/>
<text x="1085.0" y="84" font-size="34" class="b" text-anchor="middle">Pair<tspan style="fill:#6D5398">Poster</tspan></text>
<line x1="964" y1="104" x2="1206" y2="104" stroke="#D9D9D9" stroke-width="1.2"/>
<text x="962" y="132" font-size="14.5" style="fill:#6B6B6B">You give feedback</text>
<text x="962" y="155" font-size="16" style="fill:#27709C">boxes drawn on the poster,</text>
<text x="962" y="176" font-size="16" style="fill:#27709C">in your browser</text>
<text x="962" y="214" font-size="14.5" style="fill:#6B6B6B">Your agent delivers</text>
<text x="962" y="237" font-size="16" style="fill:#6D5398">a print-ready poster:</text>
<text x="962" y="258" font-size="16" style="fill:#6D5398">the PDF and the PNG</text>
<path d="M1085.0,344 L1085.0,280" stroke="#6D5398" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<rect x="10" y="348" width="1220" height="74" rx="10" fill="#FBF6E9" stroke="#C6952C" stroke-width="1.8"/>
<text x="30" y="377" font-size="17.5" class="b" style="fill:#8A6410">Your style vault, one per tool</text>
<text x="30" y="403" font-size="15.5">seeded from your own papers, decks, talks and posters; grows with every edit you keep, rewrite or undo</text>
<text x="1220" y="377" font-size="14.5" text-anchor="end" style="fill:#6D5398">read before every piece of work</text>
<rect x="10" y="436" width="1220" height="44" rx="10" fill="#F3EEF8" stroke="#6D5398" stroke-width="1.6"/>
<text x="620" y="464" font-size="16" text-anchor="middle"><tspan class="b" style="fill:#6D5398">Your agent</tspan> does the thinking: Claude Code, Codex, or any agent that runs shell commands, on your own plan</text>
</svg>
