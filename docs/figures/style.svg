<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-label="How the style guide learns: your rewrites, undos, stated preferences, own writing and kept edits become evidence, distilled into STYLE.md, which the agent reads before every edit">
<style>text{font-family:'CMU Serif','Latin Modern Roman',Georgia,'Times New Roman',serif;fill:#232323} .m{font-family:Menlo,'SF Mono',Consolas,'DejaVu Sans Mono',monospace} .b{font-weight:700} .i{font-style:italic}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6B6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#C6952C"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6D5398"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#27709C"/></marker><marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#227828"/></marker></defs>
<text x="10" y="18" font-size="15.5" style="fill:#6B6B6B">What you do</text>
<rect x="10" y="30" width="340" height="46" rx="6" fill="#EAF2F8" stroke="#27709C" stroke-width="1.6"/>
<text x="24" y="59" font-size="16"><tspan class="b">You rewrite</tspan> the agent’s text</text>
<text x="338" y="59" font-size="14.5" class="i" text-anchor="end" style="fill:#27709C">strongest</text>
<path d="M352,53 C380,53 380,161 404,161" stroke="#9A9A9A" stroke-width="1.6" fill="none"/>
<rect x="10" y="84" width="340" height="46" rx="6" fill="#EAF2F8" stroke="#27709C" stroke-width="1.6"/>
<text x="24" y="113" font-size="16"><tspan class="b">You undo</tspan> an edit</text>
<text x="338" y="113" font-size="14.5" class="i" text-anchor="end" style="fill:#27709C">never again</text>
<path d="M352,107 C380,107 380,161 404,161" stroke="#9A9A9A" stroke-width="1.6" fill="none"/>
<rect x="10" y="138" width="340" height="46" rx="6" fill="#EAF2F8" stroke="#27709C" stroke-width="1.6"/>
<text x="24" y="167" font-size="16"><tspan class="b">You state</tspan> a preference</text>
<text x="338" y="167" font-size="14.5" class="i" text-anchor="end" style="fill:#27709C">“always …”</text>
<path d="M352,161 C380,161 380,161 404,161" stroke="#9A9A9A" stroke-width="1.6" fill="none"/>
<rect x="10" y="192" width="340" height="46" rx="6" fill="#EAF2F8" stroke="#27709C" stroke-width="1.6"/>
<text x="24" y="221" font-size="16"><tspan class="b">You write</tspan> on your own</text>
<text x="338" y="221" font-size="14.5" class="i" text-anchor="end" style="fill:#27709C">style, not content</text>
<path d="M352,215 C380,215 380,161 404,161" stroke="#9A9A9A" stroke-width="1.6" fill="none"/>
<rect x="10" y="246" width="340" height="46" rx="6" fill="#EAF2F8" stroke="#27709C" stroke-width="1.6"/>
<text x="24" y="275" font-size="16"><tspan class="b">You keep</tspan> an edit</text>
<text x="338" y="275" font-size="14.5" class="i" text-anchor="end" style="fill:#27709C">confirms a rule</text>
<path d="M352,269 C380,269 380,161 404,161" stroke="#9A9A9A" stroke-width="1.6" fill="none"/>
<path d="M404,161 L414,161" stroke="#9A9A9A" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="418" y="118" width="160" height="86" rx="6" fill="#F6F6F4" stroke="#9A9A9A" stroke-width="1.6"/>
<text x="498" y="148" font-size="16" class="b" text-anchor="middle">Evidence log</text>
<text x="498" y="170" font-size="14.5" text-anchor="middle" style="fill:#6B6B6B">each event with</text>
<text x="498" y="189" font-size="14.5" text-anchor="middle" style="fill:#6B6B6B">its word diff</text>
<path d="M580,161 L606,161" stroke="#9A9A9A" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="612" y="12" width="346" height="282" rx="8" fill="#FBF6E9" stroke="#C6952C" stroke-width="1.8"/>
<text x="630" y="40" font-size="17" class="b" style="fill:#8A6410">STYLE.md</text>
<text x="940" y="40" font-size="14.5" text-anchor="end" style="fill:#8A6410">yours to edit</text>
<line x1="630" y1="50" x2="940" y2="50" stroke="#E5D3A6" stroke-width="1.2"/>
<text x="630" y="76" font-size="15.5" class="b">Base rules</text>
<text x="940" y="76" font-size="14.5" text-anchor="end" style="fill:#6B6B6B">only you add these</text>
<text x="630" y="108" font-size="15.5" class="b">Confirmed rules</text>
<text x="940" y="108" font-size="14.5" text-anchor="end" style="fill:#6B6B6B">3 pieces of evidence</text>
<text x="630" y="196" font-size="15.5" class="b">Tentative patterns</text>
<text x="940" y="196" font-size="14.5" text-anchor="end" style="fill:#6B6B6B">seen once or twice</text>
<text x="630" y="226" font-size="15.5" class="b">Words: prefer / avoid</text>
<text x="630" y="256" font-size="15.5" class="b">What you undid</text>
<text x="940" y="256" font-size="14.5" text-anchor="end" style="fill:#6B6B6B">never repeated</text>
<rect x="630" y="118" width="310" height="52" rx="4" fill="#FFFFFF" stroke="#E5D3A6" stroke-width="1.2"/>
<text x="640" y="139" font-size="14.5" class="i">e.g. Open each paragraph with its</text>
<text x="640" y="159" font-size="14.5" class="i">claim; the setup comes after it.</text>
<text x="630" y="282" font-size="14.5" style="fill:#6B6B6B">Every change is a git commit you can undo.</text>
<path d="M784,298 C784,318 704,322 622,322" stroke="#6D5398" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<text x="614" y="327" font-size="15" text-anchor="end" style="fill:#6D5398">the agent reads it before every edit</text>
</svg>
