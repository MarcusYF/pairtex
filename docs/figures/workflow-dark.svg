<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 488" width="1240" height="488" role="img" aria-label="Four moments of research, four tools: PairDeck reports what you found, PairTeX writes the paper, PairTalk gives the talk, PairPoster pitches it on a poster. Each keeps a style vault, seeded from your own work and grown from your feedback, and runs in the coding agent you already use">
<style>text{font-family:'CMU Serif','Latin Modern Roman',Georgia,'Times New Roman',serif;fill:#E6EDF3} .m{font-family:Menlo,'SF Mono',Consolas,'DejaVu Sans Mono',monospace} .b{font-weight:700} .i{font-style:italic}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#9198A1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#D4A33A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#B39DDB"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5AA8DA"/></marker><marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5DBB63"/></marker></defs>
<circle cx="22" cy="16" r="11" fill="#D4A33A"/><text x="22" y="21.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">1</text>
<text x="40" y="22" font-size="17" class="b">Report what you found</text>
<rect x="10" y="38" width="290" height="236" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/>
<text x="155.0" y="84" font-size="34" class="b" text-anchor="middle">Pair<tspan style="fill:#B39DDB">Deck</tspan></text>
<line x1="34" y1="104" x2="276" y2="104" stroke="#30363D" stroke-width="1.2"/>
<text x="32" y="132" font-size="14.5" style="fill:#9198A1">You give feedback</text>
<text x="32" y="155" font-size="16" style="fill:#5AA8DA">comments on a slide,</text>
<text x="32" y="176" font-size="16" style="fill:#5AA8DA">in your browser</text>
<text x="32" y="214" font-size="14.5" style="fill:#9198A1">Your agent delivers</text>
<text x="32" y="237" font-size="16" style="fill:#B39DDB">an animated HTML deck</text>
<text x="32" y="258" font-size="16" style="fill:#B39DDB">that explains one idea</text>
<path d="M304,156 L324,156" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M155.0,344 L155.0,280" stroke="#B39DDB" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<circle cx="332" cy="16" r="11" fill="#D4A33A"/><text x="332" y="21.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">2</text>
<text x="350" y="22" font-size="17" class="b">Write the paper</text>
<rect x="320" y="38" width="290" height="236" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/>
<text x="465.0" y="84" font-size="34" class="b" text-anchor="middle">Pair<tspan style="fill:#B39DDB">T</tspan><tspan dx="-3.9" dy="6.8" style="fill:#B39DDB">E</tspan><tspan dx="-3.9" dy="-6.8" style="fill:#B39DDB">X</tspan></text>
<line x1="344" y1="104" x2="586" y2="104" stroke="#30363D" stroke-width="1.2"/>
<text x="342" y="132" font-size="14.5" style="fill:#9198A1">You give feedback</text>
<text x="342" y="155" font-size="16" style="fill:#5AA8DA">%! comments in</text>
<text x="342" y="176" font-size="16" style="fill:#5AA8DA">your LaTeX source</text>
<text x="342" y="214" font-size="14.5" style="fill:#9198A1">Your agent delivers</text>
<text x="342" y="237" font-size="16" style="fill:#B39DDB">the paper, on Overleaf,</text>
<text x="342" y="258" font-size="16" style="fill:#B39DDB">git or a folder</text>
<path d="M614,156 L634,156" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M465.0,344 L465.0,280" stroke="#B39DDB" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<circle cx="642" cy="16" r="11" fill="#D4A33A"/><text x="642" y="21.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">3</text>
<text x="660" y="22" font-size="17" class="b">Give the talk</text>
<rect x="630" y="38" width="290" height="236" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/>
<text x="775.0" y="84" font-size="34" class="b" text-anchor="middle">Pair<tspan style="fill:#B39DDB">Talk</tspan></text>
<line x1="654" y1="104" x2="896" y2="104" stroke="#30363D" stroke-width="1.2"/>
<text x="652" y="132" font-size="14.5" style="fill:#9198A1">You give feedback</text>
<text x="652" y="155" font-size="16" style="fill:#5AA8DA">comments on the talk site</text>
<text x="652" y="176" font-size="16" style="fill:#5AA8DA">and script edits</text>
<text x="652" y="214" font-size="14.5" style="fill:#9198A1">Your agent delivers</text>
<text x="652" y="237" font-size="16" style="fill:#B39DDB">a talk with builds and</text>
<text x="652" y="258" font-size="16" style="fill:#B39DDB">a speaker script</text>
<path d="M924,156 L944,156" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M775.0,344 L775.0,280" stroke="#B39DDB" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<circle cx="952" cy="16" r="11" fill="#D4A33A"/><text x="952" y="21.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">4</text>
<text x="970" y="22" font-size="17" class="b">Pitch it on a poster</text>
<rect x="940" y="38" width="290" height="236" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/>
<text x="1085.0" y="84" font-size="34" class="b" text-anchor="middle">Pair<tspan style="fill:#B39DDB">Poster</tspan></text>
<line x1="964" y1="104" x2="1206" y2="104" stroke="#30363D" stroke-width="1.2"/>
<text x="962" y="132" font-size="14.5" style="fill:#9198A1">You give feedback</text>
<text x="962" y="155" font-size="16" style="fill:#5AA8DA">boxes drawn on the poster,</text>
<text x="962" y="176" font-size="16" style="fill:#5AA8DA">in your browser</text>
<text x="962" y="214" font-size="14.5" style="fill:#9198A1">Your agent delivers</text>
<text x="962" y="237" font-size="16" style="fill:#B39DDB">a print-ready poster:</text>
<text x="962" y="258" font-size="16" style="fill:#B39DDB">the PDF and the PNG</text>
<path d="M1085.0,344 L1085.0,280" stroke="#B39DDB" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<rect x="10" y="348" width="1220" height="74" rx="10" fill="#261E0F" stroke="#D4A33A" stroke-width="1.8"/>
<text x="30" y="377" font-size="17.5" class="b" style="fill:#E3B95A">Your style vault, one per tool</text>
<text x="30" y="403" font-size="15.5">seeded from your own papers, decks, talks and posters; grows with every edit you keep, rewrite or undo</text>
<text x="1220" y="377" font-size="14.5" text-anchor="end" style="fill:#B39DDB">read before every piece of work</text>
<rect x="10" y="436" width="1220" height="44" rx="10" fill="#231C33" stroke="#B39DDB" stroke-width="1.6"/>
<text x="620" y="464" font-size="16" text-anchor="middle"><tspan class="b" style="fill:#B39DDB">Your agent</tspan> does the thinking: Claude Code, Codex, or any agent that runs shell commands, on your own plan</text>
</svg>
