<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" width="960" height="488" role="img" aria-label="Three moments of research, three tools: PairDeck reports what you found, PairTeX writes the paper, PairTalk gives the talk. Each keeps a style vault, seeded from your own work and grown from your feedback, and runs in the coding agent you already use">
<style>text{font-family:'CMU Serif','Latin Modern Roman',Georgia,'Times New Roman',serif;fill:#E6EDF3} .m{font-family:Menlo,'SF Mono',Consolas,'DejaVu Sans Mono',monospace} .b{font-weight:700} .i{font-style:italic}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#9198A1"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#D4A33A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#B39DDB"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5AA8DA"/></marker><marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5DBB63"/></marker></defs>
<circle cx="22" cy="16" r="11" fill="#D4A33A"/><text x="22" y="21.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">1</text>
<text x="40" y="22" font-size="17" class="b">Report what you found</text>
<rect x="10" y="38" width="300" height="236" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/>
<text x="160.0" y="84" font-size="34" class="b" text-anchor="middle">Pair<tspan style="fill:#B39DDB">Deck</tspan></text>
<line x1="34" y1="104" x2="286" y2="104" stroke="#30363D" stroke-width="1.2"/>
<text x="32" y="132" font-size="14.5" style="fill:#9198A1">You give feedback</text>
<text x="32" y="155" font-size="16" style="fill:#5AA8DA">comments on a slide,</text>
<text x="32" y="176" font-size="16" style="fill:#5AA8DA">in your browser</text>
<text x="32" y="214" font-size="14.5" style="fill:#9198A1">Your agent delivers</text>
<text x="32" y="237" font-size="16" style="fill:#B39DDB">an animated HTML deck</text>
<text x="32" y="258" font-size="16" style="fill:#B39DDB">that explains one idea</text>
<path d="M314,156 L334,156" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M160.0,344 L160.0,280" stroke="#B39DDB" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<circle cx="342" cy="16" r="11" fill="#D4A33A"/><text x="342" y="21.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">2</text>
<text x="360" y="22" font-size="17" class="b">Write the paper</text>
<rect x="330" y="38" width="300" height="236" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/>
<text x="480.0" y="84" font-size="34" class="b" text-anchor="middle">Pair<tspan style="fill:#B39DDB">T</tspan><tspan dx="-3.9" dy="6.8" style="fill:#B39DDB">E</tspan><tspan dx="-3.9" dy="-6.8" style="fill:#B39DDB">X</tspan></text>
<line x1="354" y1="104" x2="606" y2="104" stroke="#30363D" stroke-width="1.2"/>
<text x="352" y="132" font-size="14.5" style="fill:#9198A1">You give feedback</text>
<text x="352" y="155" font-size="16" style="fill:#5AA8DA">%! comments in</text>
<text x="352" y="176" font-size="16" style="fill:#5AA8DA">your LaTeX source</text>
<text x="352" y="214" font-size="14.5" style="fill:#9198A1">Your agent delivers</text>
<text x="352" y="237" font-size="16" style="fill:#B39DDB">the paper, on Overleaf,</text>
<text x="352" y="258" font-size="16" style="fill:#B39DDB">git or a folder</text>
<path d="M634,156 L654,156" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M480.0,344 L480.0,280" stroke="#B39DDB" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<circle cx="662" cy="16" r="11" fill="#D4A33A"/><text x="662" y="21.2" font-size="15" class="b" text-anchor="middle" fill="#0D1117" style="fill:#0D1117">3</text>
<text x="680" y="22" font-size="17" class="b">Give the talk</text>
<rect x="650" y="38" width="300" height="236" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.6"/>
<text x="800.0" y="84" font-size="34" class="b" text-anchor="middle">Pair<tspan style="fill:#B39DDB">Talk</tspan></text>
<line x1="674" y1="104" x2="926" y2="104" stroke="#30363D" stroke-width="1.2"/>
<text x="672" y="132" font-size="14.5" style="fill:#9198A1">You give feedback</text>
<text x="672" y="155" font-size="16" style="fill:#5AA8DA">comments on the talk site</text>
<text x="672" y="176" font-size="16" style="fill:#5AA8DA">and script edits</text>
<text x="672" y="214" font-size="14.5" style="fill:#9198A1">Your agent delivers</text>
<text x="672" y="237" font-size="16" style="fill:#B39DDB">a talk with builds and</text>
<text x="672" y="258" font-size="16" style="fill:#B39DDB">a speaker script</text>
<path d="M800.0,344 L800.0,280" stroke="#B39DDB" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ap)"/>
<rect x="10" y="348" width="940" height="74" rx="10" fill="#261E0F" stroke="#D4A33A" stroke-width="1.8"/>
<text x="30" y="377" font-size="17.5" class="b" style="fill:#E3B95A">Your style vault, one per tool</text>
<text x="30" y="403" font-size="15.5">seeded from your own papers, decks and talks; grows with every edit you keep, rewrite or undo</text>
<text x="940" y="377" font-size="14.5" text-anchor="end" style="fill:#B39DDB">read before every piece of work</text>
<rect x="10" y="436" width="940" height="44" rx="10" fill="#231C33" stroke="#B39DDB" stroke-width="1.6"/>
<text x="480" y="464" font-size="16" text-anchor="middle"><tspan class="b" style="fill:#B39DDB">Your agent</tspan> does the thinking: Claude Code, Codex, or any agent that runs shell commands, on your own plan</text>
</svg>
