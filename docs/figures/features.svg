<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 348" width="960" height="348" role="img" aria-label="Built for real papers: works where you write, several authors with several loops, safe by default, ready for submission">
<style>text{font-family:'CMU Serif','Latin Modern Roman',Georgia,'Times New Roman',serif;fill:#232323} .m{font-family:Menlo,'SF Mono',Consolas,'DejaVu Sans Mono',monospace} .b{font-weight:700} .i{font-style:italic}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6B6B6B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#C6952C"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6D5398"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#27709C"/></marker><marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#227828"/></marker></defs>
<rect x="0" y="0" width="474" height="168" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/><path d="M0,8 a8,8 0 0 1 8,-8 h458 a8,8 0 0 1 8,8 v-4 h-474 Z" fill="#27709C"/>
<g transform="translate(18,18) scale(0.58)" fill="none" stroke="#27709C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="9" width="36" height="28" rx="3"/><path d="M16 43h16M24 37v6M13 18l5 5-5 5M22 28h10"/></g>
<text x="54" y="39" font-size="18" class="b" style="fill:#27709C">Works where you write</text>
<circle cx="24" cy="67" r="3" fill="#27709C"/><text x="36" y="72" font-size="15"><tspan class="b">Overleaf</tspan>, through its git integration</text>
<circle cx="24" cy="93" r="3" fill="#27709C"/><text x="36" y="98" font-size="15"><tspan class="b">GitHub, GitLab</tspan> or any git remote</text>
<circle cx="24" cy="119" r="3" fill="#27709C"/><text x="36" y="124" font-size="15"><tspan class="b">A local folder</tspan>: VS Code, TeXstudio, Emacs</text>
<circle cx="24" cy="145" r="3" fill="#27709C"/><text x="36" y="150" font-size="15"><tspan class="b">Any agent</tspan>: Claude Code, Codex, …</text>
<rect x="486" y="0" width="474" height="168" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/><path d="M486,8 a8,8 0 0 1 8,-8 h458 a8,8 0 0 1 8,8 v-4 h-474 Z" fill="#6D5398"/>
<g transform="translate(504,18) scale(0.58)" fill="none" stroke="#6D5398" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="16" r="6"/><circle cx="33" cy="16" r="6"/><path d="M6 40c0-7 5-12 11-12s11 5 11 12M24 31c2-2 5-3 9-3 6 0 11 5 11 12"/></g>
<text x="540" y="39" font-size="18" class="b" style="fill:#6D5398">Several authors, several loops</text>
<circle cx="510" cy="67" r="3" fill="#6D5398"/><text x="522" y="72" font-size="15">Each loop answers only its owner’s comments</text>
<circle cx="510" cy="93" r="3" fill="#6D5398"/><text x="522" y="98" font-size="15">Ids carry the owner’s prefix: <tspan class="m" style="fill:#6D5398">ada7</tspan>, <tspan class="m" style="fill:#6D5398">grace3</tspan></text>
<circle cx="510" cy="119" r="3" fill="#6D5398"/><text x="522" y="124" font-size="15">Each loop learns only from its owner’s edits</text>
<circle cx="510" cy="145" r="3" fill="#6D5398"/><text x="522" y="150" font-size="15">Coauthors without a loop can be answered too</text>
<rect x="0" y="180" width="474" height="168" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/><path d="M0,188 a8,8 0 0 1 8,-8 h458 a8,8 0 0 1 8,8 v-4 h-474 Z" fill="#227828"/>
<g transform="translate(18,198) scale(0.58)" fill="none" stroke="#227828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5l15 6v11c0 10-6 17-15 21C15 39 9 32 9 22V11z"/><path d="M17 24l5 5 9-10"/></g>
<text x="54" y="219" font-size="18" class="b" style="fill:#227828">Safe by default</text>
<circle cx="24" cy="247" r="3" fill="#227828"/><text x="36" y="252" font-size="15">A compile check before every publish</text>
<circle cx="24" cy="273" r="3" fill="#227828"/><text x="36" y="278" font-size="15">Never adds files or deletes a thread unasked</text>
<circle cx="24" cy="299" r="3" fill="#227828"/><text x="36" y="304" font-size="15">Your typing wins: it redoes its edit on yours</text>
<circle cx="24" cy="325" r="3" fill="#227828"/><text x="36" y="330" font-size="15">Every change is a commit: <tspan class="m" style="fill:#227828">pairtex: c7: …</tspan></text>
<rect x="486" y="180" width="474" height="168" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.2"/><path d="M486,188 a8,8 0 0 1 8,-8 h458 a8,8 0 0 1 8,8 v-4 h-474 Z" fill="#8A6410"/>
<g transform="translate(504,198) scale(0.58)" fill="none" stroke="#8A6410" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h17l9 9v29H12z"/><path d="M29 5v9h9M18 27l5 5 8-9"/></g>
<text x="540" y="219" font-size="18" class="b" style="fill:#8A6410">Ready for submission</text>
<circle cx="510" cy="247" r="3" fill="#8A6410"/><text x="522" y="252" font-size="15"><tspan class="m" style="fill:#8A6410">pairtex check</tspan> lists what is left in the paper</text>
<circle cx="510" cy="273" r="3" fill="#8A6410"/><text x="522" y="278" font-size="15"><tspan class="m" style="fill:#8A6410">pairtex clean</tspan> writes a copy without it</text>
<circle cx="510" cy="299" r="3" fill="#8A6410"/><text x="522" y="304" font-size="15">It drops % comments too: arXiv shows your source</text>
<circle cx="510" cy="325" r="3" fill="#8A6410"/><text x="522" y="330" font-size="15">One switch hides every note in the PDF</text>
</svg>
